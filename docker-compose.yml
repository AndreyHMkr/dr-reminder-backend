version: "3.9"

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  celery:
    build: .
    command: celery -A dr_reminder_api worker -l info --pool=solo
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
  celery-beat:
    build: .
    command: celery -A dr_reminder_api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
  bot:
    build: .
    command: python -u -m telegram_notifications.bot
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      API_URL: "http://web:8000/api/telegram/link/"
    depends_on: [ web ]
    restart: unless-stopped


volumes:
  my_db: